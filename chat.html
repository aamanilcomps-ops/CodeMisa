<!DOCTYPE html><html><head><meta name=viewport content=width=device-width,initial-scale=1><title>MISA Chat</title><style>body{margin:0;background:#050a14;color:#fff;font-family:system-ui;display:flex;flex-direction:column;height:100vh}.box{flex:1;overflow:auto;padding:20px}.msg{background:rgba(255,255,255,0.08);padding:12px 16px;border-radius:16px;margin:10px 0;max-width:80%}.msg[user]{background:#00f0ff;color:#000;margin-left:auto}#i{flex:1;background:#111a2e;color:#fff;border:1px solid #00f0ff33;border-radius:999px;padding:14px 18px;outline:none}</style></head><body><div class=box id=box><div class=msg>Hi, I am MISA — your super intelligent OS. How can I help?</div></div><div style=display:flex;gap:10px;padding:10px><input id=i placeholder="Ask MISA anything..."><button onclick=send() style=background:#00f0ff;border:none;border-radius:50%;width:50px;height:50px;cursor:pointer>→</button></div><script>async function send(){let v=i.value;if(!v)return;box.innerHTML+=`<div class=msg user>${v}</div>`;i.value='';let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:v})});let j=await r.json();box.innerHTML+=`<div class=msg>${j.reply}</div>`;box.scrollTop=box.scrollHeight}</script></body></html>
