<!DOCTYPE html><html><head><meta name=viewport content=width=device-width,initial-scale=1><style>body{margin:0;background:#050a14;color:#fff;font-family:system-ui;display:flex;flex-direction:column;height:100vh}.box{flex:1;overflow:auto;padding:20px}.msg{background:rgba(0,240,255,0.1);border:1px solid #00f0ff33;padding:12px 16px;border-radius:16px;margin:10px 0;max-width:80%}input{margin:10px;padding:16px;border-radius:999px;border:none;outline:none;width:calc(100% - 60px);background:#0f1b2d;color:#fff}</style></head><body><div class=box id=box><div class=msg>Hi, I am MISA — your super intelligent OS. How can I help?</div></div><div style=display:flex;padding:10px><input id=i placeholder=Ask MISA anything...><button onclick="box.innerHTML+=<div class=msg>+i.value+</div>;i.value=''" style=background:#00f0ff;border:none;border-radius:50%;width:50px;height:50px>→</button></div></body></html>
