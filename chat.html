<!DOCTYPE html><html><head><meta name=viewport content=width=device-width,initial-scale=1><title>MISA Chat</title><style>body{margin:0;background:#050a14;color:#fff;font-family:system-ui;display:flex;flex-direction:column;height:100vh}.box{flex:1;overflow:auto;padding:20px}.msg{background:rgba(255,255,255,0.08);padding:12px 16px;border-radius:16px;margin:10px 0;max-width:80%;white-space:pre-wrap}.msg[user]{background:#00f0ff;color:#000;margin-left:auto}#i{flex:1;background:#111a2e;color:#fff;border:1px solid #00f0ff33;border-radius:999px;padding:14px 18px;outline:none}button{border:none;border-radius:999px;padding:10px 14px;cursor:pointer}</style></head><body><div class=box id=box><div class=msg>Hi, I am MISA — ask, image: prompt, or code: build React todo</div></div><div style=display:flex;gap:6px;padding:10px;align-items:center><input id=i placeholder="Ask / image: / code: ..."><input type=file id=f style=display:none onchange=upload()><button onclick=f.click() style=background:#1a2a4a;color:#fff>📎</button><button onclick=listen() style=background:#1a2a4a;color:#fff>🎤</button><button onclick=sendCode() style=background:#7c3aed;color:#fff>Code</button><button onclick=send() style=background:#00f0ff>→</button></div><script>function speak(t){speechSynthesis.speak(new SpeechSynthesisUtterance(t))}function listen(){let r=new(window.SpeechRecognition||window.webkitSpeechRecognition)();r.lang='en-US';r.onresult=e=>{i.value=e.results[0][0].transcript;send()};r.start()}async function upload(){let file=f.files[0];if(!file)return;box.innerHTML+=<div class=msg user>📎 ${file.name}</div>;let d=new FormData();d.append('file',file);let r=await fetch('/api/upload',{method:'POST',body:d});let j=await r.json();box.innerHTML+=<div class=msg>📄 Received: ${j.name} <a href="#" style="color:#00f0ff">Download</a></div>}async function sendCode(){let v=i.value;if(!v)return;box.innerHTML+=<div class=msg user>code: ${v}</div>;i.value='';box.innerHTML+=<div class=msg>Generating code...</div>;let r=await fetch('/api/code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:v})});let j=await r.json();box.innerHTML+=<div class=msg><pre style="white-space:pre-wrap">${j.code}</pre><br><a href="#" onclick="navigator.clipboard.writeText(\${j.code.replace(//g,'\\')}\)" style="color:#00f0ff">Copy code</a></div>}async function send(){let v=i.value;if(!v)return;box.innerHTML+=<div class=msg user>${v}</div>;i.value='';if(v.toLowerCase().startsWith('image:')){let p=v.slice(6);box.innerHTML+=<div class=msg>Generating image...</div>;let r=await fetch('/api/image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p})});let j=await r.json();box.innerHTML+=<div class=msg><img src="${j.url}" style="max-width:100%;border-radius:12px"><br><a href="${j.url}" download style="color:#00f0ff">Download</a></div>}else{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:v})});let j=await r.json();box.innerHTML+=<div class=msg>${j.reply}</div>;speak(j.reply)}}</script></body></html>
