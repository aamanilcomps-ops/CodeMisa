<!DOCTYPE html><html><head><meta name=viewport content=width=device-width,initial-scale=1><title>MISA Chat</title><style>body{margin:0;background:#050a14;color:#fff;font-family:system-ui;display:flex;flex-direction:column;height:100vh}.box{flex:1;overflow:auto;padding:20px}.msg{background:rgba(255,255,255,0.08);padding:12px 16px;border-radius:16px;margin:10px 0;max-width:80%}.msg[user]{background:#00f0ff;color:#000;margin-left:auto}#i{flex:1;background:#111a2e;color:#fff;border:1px solid #00f0ff33;border-radius:999px;padding:14px 18px;outline:none}button{border:none;border-radius:50%;width:48px;height:48px;cursor:pointer}</style></head><body><div class=box id=box><div class=msg>Hi, I am MISA — your super intelligent OS. How can I help?</div></div><div style=display:flex;gap:8px;padding:10px;align-items:center><input id=i placeholder="Ask MISA anything..."><button onclick=listen() style=background:#1a2a4a;color:#fff>🎤</button><button onclick=send() style=background:#00f0ff>→</button></div><script>function speak(t){speechSynthesis.speak(new SpeechSynthesisUtterance(t))}function listen(){let r=new(window.SpeechRecognition||window.webkitSpeechRecognition)();r.lang='en-US';r.onresult=e=>{i.value=e.results[0][0].transcript;send()};r.start()}async function send(){let v=i.value;if(!v)return;box.innerHTML+=<div class=msg user>${v}</div>;i.value='';box.scrollTop=box.scrollHeight;let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:v})});let j=await r.json();box.innerHTML+=<div class=msg>${j.reply}</div>;box.scrollTop=box.scrollHeight;speak(j.reply)}</script></body></html>
