<!DOCTYPE html><html><head><meta name=viewport content=width=device-width,initial-scale=1><style>body{margin:0;background:#050a14;color:#fff;font-family:system-ui;display:flex;flex-direction:column;height:100vh}.box{flex:1;overflow:auto;padding:20px}.msg{background:rgba(0,240,255,0.1);border:1px solid #00f0ff33;padding:12px 16px;border-radius:16px;margin:10px 0;max-width:80%}.user{margin-left:auto;background:#7a5cff33}input{margin:10px;padding:16px;border-radius:999px;border:none;outline:none;width:calc(100% - 60px);background:#0f1b2d;color:#fff}</style></head><body><div class=box id=box><div class=msg>Hi, I am MISA — your super intelligent OS. How can I help?</div></div><div style=display:flex;padding:10px><input id=i placeholder=Ask MISA anything...><button onclick=send() style=background:#00f0ff;border:none;border-radius:50%;width:50px;height:50px>→</button></div><script>async function send(){let v=i.value;if(!v)return;box.innerHTML+=<div class=msg user>${v}</div>;i.value='';let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:v})});let j=await r.json();box.innerHTML+=<div class=msg>${j.reply}</div>;box.scrollTop=box.scrollHeight}</script></body></html>
